[workspace]
resolver = "2"
members = [
  "crates/contracts",
  "crates/server",
  "crates/client",
  "crates/ui",
  "crates/acp",
  "crates/terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
t3-contracts = { path = "crates/contracts" }
t3-client = { path = "crates/client" }
t3-acp = { path = "crates/acp" }
t3-terminal = { path = "crates/terminal" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
fs2 = "0.4"
flate2 = "1"
notify = "8"
if-addrs = "=0.13.4"
libc = "0.2"
fff-search = { version = "=0.9.4", default-features = false }
regex = "1"
icu_collator = "2"
icu_locale = "2"
portable-pty = "0.9"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
  "gzip",
  "brotli",
  "deflate",
] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28"
dioxus = { version = "0.7", default-features = false, features = [
  "macro",
  "html",
  "signals",
  "hooks",
  "launch",
] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
