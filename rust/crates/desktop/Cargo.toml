[package]
name = "t3-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# The desktop shell's logic without any window toolkit: the application menu model, the saved window state, the
# supervisor of the T3 Code server this app starts, and the quit-hold timing. `t3-ui` uses it under its `desktop`
# feature and puts these on the screen.
[dependencies]
serde.workspace = true
serde_json.workspace = true
url.workspace = true
rand.workspace = true
t3-remote = { path = "../remote" }
t3-client.workspace = true
async-trait = "0.1"
thiserror.workspace = true
tokio = { workspace = true, features = [
  "process",
  "sync",
  "time",
  "rt",
  "macros",
  "net",
  "io-util",
  "signal",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
t3-remote = { path = "../remote", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
