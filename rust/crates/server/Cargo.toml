[package]
name = "t3-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio-tungstenite.workspace = true
notify.workspace = true
indexmap.workspace = true
url.workspace = true
reqwest.workspace = true
fs2.workspace = true
libc.workspace = true
if-addrs.workspace = true
portable-pty.workspace = true
t3-contracts.workspace = true
t3-acp.workspace = true
t3-vcs.workspace = true
# T3 Connect: the cloud link, the managed tunnel and the relay client (`connect.rs` wires them in).
t3-remote = { path = "../remote" }
async-trait = "0.1"
# The pairing QR code `pair --tailscale` prints (the library the original's `@t3tools/shared/qrCode` is).
qrcodegen = "1.8"
# Verifies DPoP proofs (ES256), which `dpop.rs` checks the way the original's noble-curves does.
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
fff-search.workspace = true
regex.workspace = true
icu_collator.workspace = true
icu_locale.workspace = true
icu_normalizer = "2"
unicode-segmentation = "1.12"
hmac.workspace = true
sha2.workspace = true
# Inflates the entries of Antigravity's release archive.
flate2.workspace = true
# Brotli, the first choice of the response compression (`response_compression.rs`); already in the lock through reqwest.
brotli = "8"
base64.workspace = true
rand.workspace = true
# Named zones: usage buckets days in the zone the client names. Also drives the schedule fixtures.
chrono-tz = { version = "0.10", default-features = false }

[features]
# Validates every reply the transport writes against the schema the original encodes it with (`rpc_response.rs`). Switched on for
# the tests by the dev-dependency below, never in a build of the server.
outbound-check = []

[dev-dependencies]
t3-server = { path = ".", features = ["outbound-check"] }
# The fakes of the relay, the connector and the services, shared with the remote crate's own flows.
t3-remote = { path = "../remote", features = ["test-support"] }
flate2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
tower.workspace = true
