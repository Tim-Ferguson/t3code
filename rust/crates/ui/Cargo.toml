[package]
name = "t3-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:t3-desktop", "dep:rfd", "dep:webbrowser"]
mobile = ["dioxus/mobile"]

[dependencies]
t3-client.workspace = true
t3-highlight.workspace = true
t3-contracts.workspace = true
t3-desktop = { path = "../desktop", optional = true }
rfd = { version = "0.17", optional = true }
webbrowser = { version = "1", optional = true }
indexmap.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true
base64.workspace = true
dioxus-stores = "0.7"
dioxus = { workspace = true, features = ["document", "asset", "mounted"] }
ewebsock = { version = "0.8", features = ["tls"] }
futures-channel = "0.3"
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
uuid = { workspace = true, features = ["js"] }
url = "2"
pulldown-cmark = "0.13"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "console",
  "Navigator",
  "Location",
  "Storage",
  "EventTarget",
  "Event",
  "AbortController",
  "AbortSignal",
  "RequestInit",
  "Response",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
iana-time-zone = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
t3-desktop = { path = "../desktop" }
dioxus-html = { version = "0.7", features = ["serialize"] }
t3-server = { path = "../server", features = ["outbound-check"] }
# The T3 Connect section is tested against the server's own services over the fakes of `t3-remote`'s tests.
t3-remote = { path = "../remote", features = ["test-support"] }
async-trait = "0.1"
axum.workspace = true
tempfile = "3"
tokio-tungstenite.workspace = true
sha2.workspace = true
