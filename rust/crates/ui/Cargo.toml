[package]
name = "t3-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
t3-client.workspace = true
t3-contracts.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true
dioxus-stores = "0.7"
dioxus = { workspace = true, features = ["document", "asset", "mounted"] }
ewebsock = { version = "0.8", features = ["tls"] }
futures-channel = "0.3"
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
uuid = { workspace = true, features = ["js"] }
pulldown-cmark = "0.13"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "Storage",
  "EventTarget",
  "Event",
  "AbortController",
  "AbortSignal",
  "RequestInit",
  "Response",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
dioxus-html = { version = "0.7", features = ["serialize"] }
t3-server = { path = "../server" }
axum.workspace = true
tempfile = "3"
